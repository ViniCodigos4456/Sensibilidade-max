
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sensibilidade Max</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: white;
  background:
    linear-gradient(
      rgba(3, 8, 25, 0.55),
      rgba(3, 8, 25, 0.88)
    ),
    url("killua.png") center center / cover fixed no-repeat;
  background-color: #030819;
}

.container {
  width: 90%;
  max-width: 420px;
  margin: auto;
  padding: 30px 0;
}

h1 {
  text-align: center;
  color: #38b6ff;
  text-shadow: 0 0 15px #0077ff;
}

.subtitulo {
  text-align: center;
  color: #c9eaff;
}

.card {
  margin-top: 22px;
  padding: 20px;
  border: 1px solid #168bff;
  border-radius: 16px;
  background: rgba(4, 12, 35, 0.85);
  box-shadow: 0 0 18px rgba(0, 119, 255, 0.25);
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 7px;
}

input, select, button {
  width: 100%;
  padding: 13px;
  border-radius: 9px;
  border: 1px solid #278dff;
  font-size: 16px;
}

input, select {
  color: white;
  background: #101d3a;
}

button {
  margin-top: 18px;
  border: none;
  color: white;
  background: linear-gradient(90deg, #075bff, #00b7ff);
  font-weight: bold;
}

button:active {
  transform: scale(0.98);
}

#resultado {
  display: none;
  white-space: pre-line;
  line-height: 1.8;
}

.dicas {
  color: #c9eaff;
}
</style>
</head>

<body>
<div class="container">

  <h1>SENSIBILIDADE MAX</h1>
  <p class="subtitulo">Sua configuração para Free Fire</p>

  <div class="card">
    <label for="celular">Modelo do celular</label>
    <input id="celular" list="modelos"
      placeholder="Digite seu celular">

    <datalist id="modelos">
      <option value="Redmi Note 11">
      <option value="Redmi Note 12">
      <option value="Redmi Note 13">
      <option value="Samsung Galaxy A15">
      <option value="Samsung Galaxy A25">
      <option value="iPhone">
      <option value="Realme">
      <option value="Moto G">
    </datalist>

    <label for="estilo">Tipo de sensibilidade</label>
    <select id="estilo">
      <option value="alta">Alta</option>
      <option value="padrao">Padrão</option>
    </select>

    <label for="botao">Tamanho do botão de tiro</label>
    <input id="botao" type="number"
      min="1" max="100" value="50">

    <button onclick="gerarSensi()">GERAR SENSI</button>
  </div>

  <div class="card" id="resultado">
    <h2> SUA CONFIGURAÇÃO </h2>
    <div id="valores"></div>
    <button onclick="copiarSensi()">COPIAR CONFIGURAÇÃO</button>
  </div>

  <div class="card dicas">
    <h2>Dicas</h2>
    <p>• Teste a sensibilidade no modo treinamento.</p>
    <p>• Faça pequenos ajustes conforme sua jogabilidade.</p>
    <p>• Os valores são sugestões, não garantem capa.</p>
  </div>

</div>

<script>
function gerarSensi() {
  const celular = document.getElementById("celular").value.trim();
  const estilo = document.getElementById("estilo").value;
  const botao = Number(document.getElementById("botao").value);

  if (!celular) {
    alert("Digite o modelo do seu celular!");
    return;
  }

  if (!Number.isInteger(botao) || botao < 1 || botao > 100) {
    alert("Digite um tamanho de botão entre 1 e 100.");
    return;
  }

  let sensi;

  if (estilo === "alta") {
    sensi = {
      "Geral": 200,
      "Ponto Vermelho": 170,
      "Mira 2x": 190,
      "Mira 4x": 170,
      "AWM": 20,
      "Olhadinha": 100
    };
  } else {
    sensi = {
      "Geral": 180,
      "Ponto Vermelho": 150,
      "Mira 2x": 160,
      "Mira 4x": 140,
      "AWM": 20,
      "Olhadinha": 100
    };
  }

  const texto =
    "Celular: " + celular + "\n" +
    "Estilo: " + (estilo === "alta" ? "Alta" : "Padrão") + "\n" +
    "Botão de tiro: " + botao + "%\n\n" +
    Object.entries(sensi)
      .map(([nome, valor]) => nome + ": " + valor)
      .join("\n");

  document.getElementById("valores").textContent = texto;
  document.getElementById("resultado").style.display = "block";
  window.configGerada = texto;
}

function copiarSensi() {
  if (window.configGerada) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(window.configGerada)
        .then(() => alert("Configuração copiada!"))
        .catch(() => alert("Não foi possível copiar. Selecione o texto manualmente."));
    } else {
      alert("Seu navegador não permitiu copiar automaticamente.");
    }
  }
}
</script>
</body>
</html>
