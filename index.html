<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sensibilidade Max</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    color: white;
    min-height: 100vh;
    background:
        linear-gradient(rgba(3,10,25,.82), rgba(2,6,18,.94)),
        url("killua.png") center/cover fixed;
}

.container {
    width: 92%;
    max-width: 720px;
    margin: auto;
    padding: 30px 0 50px;
}

/* TOPO */
.top {
    text-align: center;
    margin-bottom: 25px;
}

.badge {
    display: inline-block;
    padding: 9px 17px;
    border: 1px solid #3b82f6;
    border-radius: 30px;
    background: rgba(20,30,70,.65);
    color: #60d5ff;
    font-size: 13px;
    letter-spacing: 1px;
    margin-bottom: 15px;
}

h1 {
    font-size: 42px;
    margin-bottom: 8px;
}

h1 span {
    color: #18cfff;
}

.subtitle {
    color: #aebbd0;
    font-size: 15px;
}

/* CONTADORES */
.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 25px 0;
}

.stat {
    padding: 18px 8px;
    text-align: center;
    border: 1px solid #164d78;
    border-radius: 18px;
    background: rgba(5,18,40,.75);
}

.stat strong {
    display: block;
    font-size: 22px;
}

.stat small {
    color: #8193ac;
}

/* CARD */
.card {
    background: rgba(4,20,43,.82);
    border: 1px solid #0877bd;
    border-radius: 25px;
    padding: 24px;
    margin-bottom: 18px;
    box-shadow: 0 0 25px rgba(0,130,255,.12);
}

.title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 15px;
}

input, select {
    width: 100%;
    padding: 17px;
    border-radius: 15px;
    border: 1px solid #185b88;
    background: #071d37;
    color: white;
    font-size: 16px;
    outline: none;
}

input:focus, select:focus {
    border-color: #13cfff;
    box-shadow: 0 0 12px rgba(19,207,255,.25);
}

/* MARCAS */
.brands {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 5px;
}

.brand {
    flex: 0 0 auto;
    padding: 12px 16px;
    border-radius: 13px;
    border: 1px solid #294867;
    background: #0a1c34;
    color: #b9c8da;
    cursor: pointer;
}

.brand.active {
    background: linear-gradient(135deg,#624cff,#00cfff);
    color: white;
    border-color: #4bcfff;
}

/* ESTILOS */
.modes {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 10px;
}

.mode {
    text-align: center;
    padding: 20px 8px;
    border: 1px solid #294867;
    border-radius: 17px;
    background: #081a31;
    cursor: pointer;
}

.mode span {
    display: block;
    font-size: 26px;
    margin-bottom: 8px;
}

.mode.active {
    border-color: #15cfff;
    background: linear-gradient(145deg,#15245c,#073b59);
    box-shadow: 0 0 18px rgba(0,190,255,.2);
}

/* BOTÕES */
button {
    border: none;
    color: white;
    cursor: pointer;
}

.detect {
    width: 100%;
    margin-top: 12px;
    padding: 16px;
    border-radius: 15px;
    background: #102743;
    border: 1px solid #31516e;
    font-size: 15px;
}

.generate {
    width: 100%;
    padding: 20px;
    border-radius: 18px;
    font-size: 19px;
    font-weight: bold;
    background: linear-gradient(90deg,#604cff,#09cfff);
    box-shadow: 0 0 25px rgba(0,180,255,.25);
}

.generate:active {
    transform: scale(.98);
}

/* RESULTADO */
#resultado {
    display: none;
}

.sensi-grid {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 10px;
    margin-top: 15px;
}

.sensi {
    padding: 17px;
    border-radius: 14px;
    background: #071b33;
    border: 1px solid #17547e;
    text-align: center;
}

.sensi strong {
    display: block;
    font-size: 25px;
    color: #20d4ff;
    margin-top: 5px;
}

/* DICAS */
.dicas {
    margin-top: 20px;
}

.dicas p {
    color: #aebbd
