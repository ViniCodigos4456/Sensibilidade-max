<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sensi FF</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: white;
      min-height: 100vh;

      background:
        linear-gradient(
          rgba(7, 21, 47, 0.72),
          rgba(11, 79, 211, 0.70)
        ),
        url("killua.jpg") center/cover fixed no-repeat;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 25px 18px;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
      font-size: 32px;
    }

    .card {
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 15px;
      backdrop-filter: blur(5px);
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    select, input {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 5px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #1683ff;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    #resultado {
      margin-top: 15px;
      line-height: 1.8;
      font-size: 16px;
    }
  </style>
</head>

<body>

    <h1>SENSI FF</h1>

    <div class="card">
      <label>Celular</label>
      <select id="celular">
        <option>Redmi Note 11</option>
        <option>iPhone 11</option>
        <option>Samsung</option>
        <option>Realme</option>
      </select>
    </div>

    <div class="card">
      <label>Modo</label>
      <select id="modo">
        <option>Alta</option>
        <option>Padrão</option>
      </select>
    </div>

    <div class="card">
      <label>Tamanho do botão</label>
      <input id="botao" type="number" value="50" min="1" max="100">
    </div>

    <div class="card">
      <button onclick="gerarSensi()">GERAR SENSI</button>
      <div id="resultado"></div>
    </div>

  </div>
