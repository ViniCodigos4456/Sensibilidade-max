<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sensi FF</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: white;
  min-height: 100vh;
  background: linear-gradient(135deg, #07152f, #0b4fd3, #4720a8);
}

.container {
  max-width: 500px;
  margin: auto;
  padding: 25px 18px;
}

h1 {
  text-align: center;
  font-size: 32px;
  margin-bottom: 25px;
}

.card {
  background: rgba(0,0,0,0.45);
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 15px;
}

label {
  display: block;
  margin-bottom: 8px;
  font-weight: bold;
}

select,
input {
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 12px;
  background: #1683ff;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

#resultado {
  margin-top: 18px;
  line-height: 1.8;
}
</style>
</head>

<body>

<div class="container">

<h1>SENSI FF</h1>

<div class="card">
<label for="celular">Celular</label>

<select id="celular">
  <option>Redmi Note 11</option>
  <option>Redmi Note 12</option>
  <option>Redmi Note 13</option>
  <option>Redmi Note 14</option>
  <option>Redmi 12</option>
  <option>Redmi 13</option>
  <option>POCO X3 Pro</option>
  <option>POCO X5 Pro</option>
  <option>POCO X6</option>
  <option>Samsung Galaxy A14</option>
  <option>Samsung Galaxy A15</option>
  <option>Samsung Galaxy A24</option>
  <option>Samsung Galaxy A34</option>
  <option>iPhone 11</option>
  <option>iPhone 12</option>
  <option>iPhone 13</option>
  <option>iPhone 14</option>
  <option>iPhone 15</option>
  <option>Realme</option>
  <option>Outro celular</option>
</select>
</div>

<div class="card">
<label for="modo">Modo</label>

<select id="modo">
  <option>Alta</option>
  <option>Padrão</option>
</select>
</div>

<div class="card">
<label for="botao">Tamanho do botão</label>

<input id="botao" type="number" value="50" min="1" max="100">
</div>

<div class="card">

<button type="button" onclick="gerarSensi()">
GERAR SENSI
</button>

<div id="resultado"></div>

</div>

</div>

</html>
