<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sensibilidade MAX</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at top,#292929 0,#0b0b0b 45%,#050505 100%);
  color:white;
  padding:18px;
}

.app{
  max-width:430px;
  margin:auto;
}

.topo{
  text-align:center;
  padding:20px 10px;
}

.logo{
  font-size:14px;
  letter-spacing:4px;
  color:#aaa;
  font-weight:bold;
}

h1{
  margin:8px 0 5px;
  font-size:36px;
  font-weight:900;
}

.sub{
  margin:0;
  color:#999;
  font-size:14px;
}

.card{
  background:rgba(20,20,20,.95);
  border:1px solid #333;
  border-radius:20px;
  padding:20px;
  margin-bottom:15px;
  box-shadow:0 12px 30px rgba(0,0,0,.35);
}

.titulo-card{
  font-size:17px;
  font-weight:bold;
  margin-bottom:16px;
}

label{
  display:block;
  color:#aaa;
  font-size:13px;
  font-weight:bold;
  margin:14px 0 7px;
}

select,
input{
  width:100%;
  height:48px;
  border-radius:12px;
  border:1px solid #3b3b3b;
  background:#181818;
  color:white;
  padding:0 13px;
  font-size:15px;
  outline:none;
}

.botao-gerar{
  width:100%;
  height:58px;
  margin-top:20px;
  border:0;
  border-radius:14px;
  background:linear-gradient(135deg,#ffffff,#bdbdbd);
  color:#050505;
  font-size:17px;
  font-weight:900;
  letter-spacing:1px;
  box-shadow:0 8px 20px rgba(255,255,255,.12);
}

.botao-gerar:active{
  transform:scale(.98);
}

.resultado-titulo{
  font-size:18px;
  font-weight:bold;
  margin-bottom:12px;
}

.sensi{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#181818;
  border:1px solid #303030;
  border-radius:13px;
  padding:15px;
  margin:8px 0;
}

.sensi-nome{
  color:#ccc;
}

.sensi-valor{
  font-size:20px;
  font-weight:900;
}

.info{
  text-align:center;
  color:#666;
  font-size:11px;
  margin-top:20px;
}
</style>
</head>

<body>

<div class="app">

  <div class="topo">
    <div class="logo">FF TOOL</div>
    <h1>SENSI MAX</h1>
    <p class="sub">Gerador de sensibilidade</p>
  </div>

  <div class="card">

    <div class="titulo-card">CONFIGURAÇÃO</div>

    <label>CELULAR</label>

    <select id="celular">
      <option>Redmi Note 11</option>
      <option>iPhone 11</option>
      <option>Samsung</option>
      <option>Motorola</option>
      <option>Realme</option>
      <option>Outro</option>
    </select>

    <label>MODO</label>

    <select id="modo">
      <option>Alta</option>
      <option>Padrão</option>
    </select>

    <label>TAMANHO DO BOTÃO</label>

    <input
      id="botao"
      type="number"
      min="1"
      max="100"
      value="50"
    >

    <button class="botao-gerar" onclick="gerarSensi()">
      GERAR SENSI
    </button>

  </div>

  <div id="resultado"></div>

  <div class="info">
    Sensibilidade MAX • Projeto não oficial
  </div>

</div>

<script>

function gerarSensi(){

  let celular =
    document.getElementById("celular").value;

  let modo =
    document.getElementById("modo").value;

  let botao =
    document.getElementById("botao").value;

  let geral =
    Math.floor(Math.random()*201);

  let vermelho =
    Math.floor(Math.random()*201);

  let mira2x =
    Math.floor(Math.random()*201);

  let mira4x =
    Math.floor(Math.random()*201);

  let awm =
    Math.floor(Math.random()*201);

  let olhadinha =
    Math.floor(Math.random()*201);

  document.getElementById("resultado").innerHTML = `

    <div class="card">

      <div class="resultado-titulo">
        SUA CONFIGURAÇÃO
      </div>

      <p>Celular: <b>${celular}</b></p>
      <p>Modo: <b>${modo}</b></p>
      <p>Tamanho do botão: <b>${botao}</b></p>

    </div>

    <div class="card">

      <div class="resultado-titulo">
        SENSIBILIDADE
      </div>

      <div class="sensi">
        <span class="sensi-nome">Geral</span>
        <span class="sensi-valor">${geral}</span>
      </div>

      <div class="sensi">
        <span class="sensi-nome">Ponto Vermelho</span>
        <span class="sensi-valor">${vermelho}</span>
      </div>

      <div class="sensi">
        <span class="sensi-nome">Mira 2x</span>
        <span class="sensi-valor">${mira2x}</span>
      </div>

      <div class="sensi">
        <span class="sensi-nome">Mira 4x</span>
        <span class="sensi-valor">${mira4x}</span>
      </div>

      <div class="sensi">
        <span class="sensi-nome">AWM</span>
        <span class="sensi-valor">${awm}</span>
      </div>

      <div class="sensi">
        <span class="sensi-nome">Olhadinha</span>
        <span class="sensi-valor">${olhadinha}</span>
      </div>

    </div>
  `;
}

</script>

</body>
</html>
