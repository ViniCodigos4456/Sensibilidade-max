<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sensibilidade MAX</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
font-family:Arial,sans-serif;
background:#080808;
color:white;
padding:20px;
}

.container{
max-width:430px;
margin:auto;
}

h1{
text-align:center;
font-size:32px;
margin:10px 0 5px;
}

.subtitulo{
text-align:center;
color:#999;
margin-bottom:25px;
}

.caixa{
background:#121212;
border:1px solid #333;
border-radius:16px;
padding:18px;
margin-bottom:15px;
}

label{
display:block;
font-weight:bold;
margin:12px 0 7px;
}

select,input{
width:100%;
padding:13px;
border-radius:10px;
border:1px solid #444;
background:#1d1d1d;
color:white;
font-size:16px;
}

button{
width:100%;
margin-top:18px;
padding:16px;
border:0;
border-radius:12px;
background:white;
color:black;
font-size:18px;
font-weight:bold;
}

.sensi{
display:flex;
justify-content:space-between;
background:#191919;
border:1px solid #333;
border-radius:10px;
padding:14px;
margin:9px 0;
}

.valor{
font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>Sensibilidade MAX</h1>

<p class="subtitulo">
Gerador de sensibilidade para Free Fire
</p>

<div class="caixa">

<label>Celular</label>

<select id="celular">
<option>Redmi Note 11</option>
<option>iPhone 11</option>
<option>Samsung</option>
<option>Motorola</option>
<option>Realme</option>
<option>Outro</option>
</select>

<label>Modo</label>

<select id="modo">
<option>Alta</option>
<option>Padrão</option>
</select>

<label>Tamanho do botão</label>

<input id="botao" type="number" value="50" min="1" max="100">

<button onclick="gerarSensi()">GERAR SENSI</button>

</div>

<div id="resultado"></div>

</div>

<script>
function gerarSensi(){

let celular=document.getElementById("celular").value;
let modo=document.getElementById("modo").value;
let botao=document.getElementById("botao").value;

let geral=Math.floor(Math.random()*201);
let vermelho=Math.floor(Math.random()*201);
let mira2x=Math.floor(Math.random()*201);
let mira4x=Math.floor(Math.random()*201);
let awm=Math.floor(Math.random()*201);
let olhadinha=Math.floor(Math.random()*201);

document.getElementById("resultado").innerHTML=`

<div class="caixa">
<b>Configuração</b>
<p>Celular: ${celular}</p>
<p>Modo: ${modo}</p>
<p>Tamanho do botão: ${botao}</p>
</div>

<div class="sensi"><span>Geral</span><span class="valor">${geral}</span></div>
<div class="sensi"><span>Ponto Vermelho</span><span class="valor">${vermelho}</span></div>
<div class="sensi"><span>Mira 2x</span><span class="valor">${mira2x}</span></div>
<div class="sensi"><span>Mira 4x</span><span class="valor">${mira4x}</span></div>
<div class="sensi"><span>AWM</span><span class="valor">${awm}</span></div>
<div class="sensi"><span>Olhadinha</span><span class="valor">${olhadinha}</span></div>
`;

}
</script>

</body>
</html>
