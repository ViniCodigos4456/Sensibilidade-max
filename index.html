<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sensi FF</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: white;

  background:
    linear-gradient(rgba(0, 4, 15, .58), rgba(3, 0, 20, .72)),
    url("https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=1200&q=80")
    center/cover fixed no-repeat;
}

/* CAMADA AZUL */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: linear-gradient(
    135deg,
    rgba(0, 119, 255, .28),
    rgba(0, 0, 50, .35),
    rgba(90, 0, 255, .25)
  );
  pointer-events: none;
}

.container {
  position: relative;
  z-index: 2;

  width: 92%;
  max-width: 600px;

  margin: auto;
  padding: 30px 0 50px;
}

/* TÍTULO */

.logo {
  text-align: center;
  margin-bottom: 28px;
}

.logo h1 {
  margin: 0;

  font-size: 43px;
  font-weight: 900;
  letter-spacing: 4px;

  color: white;

  text-shadow:
    0 0 8px #00aaff,
    0 0 20px #008cff,
    0 0 40px #0066ff;
}

.logo p {
  margin-top: 8px;

  color: #91d8ff;
  font-size: 14px;
  letter-spacing: 1px;
}

/* CARDS */

.card {
  background: rgba(3, 13, 34, .74);

  border: 1px solid rgba(52, 160, 255, .30);

  border-radius: 22px;

  padding: 20px;

  margin-bottom: 17px;

  box-shadow:
    0 10px 35px rgba(0, 0, 0, .65),
    inset 0 0 25px rgba(0, 130, 255, .05);

  backdrop-filter: blur(12px);
}

label {
  display: block;

  margin-bottom: 10px;

  font-size: 15px;
  font-weight: bold;

  color: #dff4ff;
}

select,
input {
  width: 100%;
  height: 55px;

  border: 1px solid rgba(255,255,255,.12);

  border-radius: 14px;

  padding: 0 16px;

  font-size: 16px;

  color: white;

  background: rgba(5, 24, 50, .92);

  outline: none;
}

select:focus,
input:focus {
  border-color: #139cff;

  box-shadow:
    0 0 10px rgba(0, 153, 255, .45);
}

/* BOTÃO */

button {
  width: 100%;
  height: 60px;

  border: none;
  border-radius: 16px;

  background:
    linear-gradient(
      90deg,
      #006cff,
      #00aaff,
      #006cff
    );

  background-size: 200%;

  color: white;

  font-size: 17px;
  font-weight: 900;

  cursor: pointer;

  box-shadow:
    0 0 18px rgba(0, 145, 255, .55);

  transition: .2s;
}

button:hover {
  background-position: right;

  box-shadow:
    0 0 30px rgba(0, 170, 255, .85);
}

button:active {
  transform: scale(.96);
}

/* RESULTADO */

.resultado {
  display: none;
}

.resultado.ativo {
  display: block;

  animation:
    aparecer .4s ease;
}

@keyframes aparecer {
  from {
    opacity: 0;
    transform: translateY(15px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.resultado h2 {
  margin-top: 0;

  color: #62caff;

  text-shadow:
    0 0 10px rgba(0, 170, 255, .5);
}

.sensi {
  display: grid;
  gap: 10px;
}

.sensi div {
  display: flex;

  justify-content: space-between;
  align-items: center;

  padding: 14px;

  border-radius: 12px;

  background: rgba(255,255,255,.055);

  border: 1px solid rgba(255,255,255,.08);
}

.sensi strong {
  color: #69cfff;

  font-size: 17px;

  text-shadow:
    0 0 8px rgba(0, 170, 255, .5);
}
